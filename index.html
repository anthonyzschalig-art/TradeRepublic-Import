<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TR Yahoo Test">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<title>ServiceNow vs. SPY · Yahoo Test</title>
<style>
:root{
 --bg:#f1f5f9;--card:#fff;--txt:#0f172a;--muted:#64748b;--line:#e2e8f0;
 --accent:#2563eb;--good:#15803d;--bad:#b91c1c;--soft:#f8fafc
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 45px}
h1{font-size:25px;margin:4px 0}.sub,.note,.status,.meta{font-size:13px;color:var(--muted);line-height:1.45}
.sub{margin-bottom:16px}
.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,button{font:inherit;width:100%;border-radius:11px}
input{padding:11px 12px;border:1px solid var(--line);font-size:16px;background:#fff}
button{border:0;padding:12px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#e2e8f0;color:var(--txt)}
.filelabel{display:block;background:var(--accent);color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:700;cursor:pointer}
#csvFile{display:none}.hidden{display:none!important}.good{color:var(--good)}.bad{color:var(--bad)}
.result{border-top:1px solid var(--line);padding:14px 0}.result:first-child{border-top:0}
.name{font-size:18px;font-weight:750}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.box{background:var(--soft);border-radius:11px;padding:11px}
.k{font-size:11px;color:var(--muted)}.v{font-size:17px;font-weight:750;margin-top:3px}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:11px;padding:12px;max-height:300px;overflow:auto}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>ServiceNow vs. S&P 500</h1>
<div class="sub">Yahoo-Finance-Test über einen Cloudflare Worker. Keine Twelve-Data-API mehr.</div>

<div class="card">
<h2>1 · Worker-Adresse</h2>
<label>Cloudflare Worker URL</label>
<input id="workerUrl" type="url" placeholder="https://dein-worker.deinname.workers.dev">
<button class="secondary" id="saveWorker" style="margin-top:10px">Auf diesem Gerät speichern</button>
<div id="workerStatus" class="status"></div>
</div>

<div class="card">
<h2>2 · Trade-Republic-CSV</h2>
<label class="filelabel" for="csvFile">Transaktionsexport.csv auswählen</label>
<input id="csvFile" type="file" accept=".csv,text/csv">
<div id="fileStatus" class="status"></div>
</div>

<div class="card hidden" id="testCard">
<h2>3 · Test</h2>
<div id="selectionText" class="note"></div>
<button class="primary" id="runTest" style="margin-top:12px">ServiceNow + SPY testen</button>
<div id="runStatus" class="status"></div>
</div>

<div class="card hidden" id="resultsCard">
<h2>Ergebnis</h2>
<div id="results"></div>
</div>

<div class="card">
<h2>Protokoll</h2>
<div class="note" style="margin-bottom:8px">Hier siehst du die Requests an deinen Worker.</div>
<div id="log" class="log">Noch keine Anfrage.</div>
</div>
</div>

<script>
const STOCK={symbol:"NOW",name:"ServiceNow"};
const BENCH={symbol:"SPY",name:"SPDR S&P 500 ETF Trust"};
let rows=[],serviceNow=null,requests=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const n=v=>{let x=parseFloat(String(v??"").replace(",","."));return Number.isFinite(x)?x:0};
const pct=x=>Number(x||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" %";

function log(msg){
 const e=$("log");
 if(e.textContent==="Noch keine Anfrage.")e.textContent="";
 e.textContent+="["+new Date().toLocaleTimeString("de-DE")+"] "+msg+"\n";
 e.scrollTop=e.scrollHeight;
}

function parseCSV(text){
 let out=[],row=[],cur="",quote=false;
 for(let i=0;i<text.length;i++){
   const c=text[i],next=text[i+1];
   if(c==='"'){if(quote&&next==='"'){cur+='"';i++}else quote=!quote}
   else if(c===','&&!quote){row.push(cur);cur=""}
   else if((c==='\n'||c==='\r')&&!quote){
     if(c==='\r'&&next==='\n')i++;
     row.push(cur);cur="";
     if(row.some(x=>x!==""))out.push(row);
     row=[];
   }else cur+=c;
 }
 if(cur||row.length){row.push(cur);out.push(row)}
 if(out.length<2)return [];
 const head=out[0].map(x=>x.trim());
 return out.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??""])));
}

function workerUrl(){
 return $("workerUrl").value.trim().replace(/\/+$/,"");
}

$("saveWorker").onclick=()=>{
 const u=workerUrl();
 if(!u){$("workerStatus").innerHTML='<span class="bad">Bitte Worker-Adresse eingeben.</span>';return}
 localStorage.setItem("tr_yahoo_worker_url",u);
 $("workerStatus").innerHTML='<span class="good">Worker-Adresse gespeichert.</span>';
};

window.addEventListener("load",()=>{
 const u=localStorage.getItem("tr_yahoo_worker_url");
 if(u)$("workerUrl").value=u;
});

$("csvFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
   rows=parseCSV(await f.text());
   if(!rows.length)throw new Error("CSV konnte nicht gelesen werden.");

   const pos={};
   for(const r of rows){
     if(r.asset_class!=="STOCK"||!r.symbol)continue;
     if(!pos[r.symbol])pos[r.symbol]={isin:r.symbol,name:r.name||r.symbol,shares:0};
     if(r.type==="BUY"||r.type==="SELL")pos[r.symbol].shares+=n(r.shares);
   }

   serviceNow=Object.values(pos).find(x=>Math.abs(x.shares)>1e-8&&/service\s*now/i.test(x.name));
   if(!serviceNow)throw new Error("ServiceNow wurde nicht als offene Position gefunden.");

   $("selectionText").innerHTML=
     "<b>Aktie:</b> "+esc(serviceNow.name)+" · "+esc(serviceNow.isin)+"<br>"+
     "<b>Yahoo-Ticker:</b> NOW<br>"+
     "<b>Benchmark:</b> SPY";
   $("testCard").classList.remove("hidden");
   $("fileStatus").innerHTML='<span class="good">CSV geladen. ServiceNow gefunden.</span>';
 }catch(err){
   $("fileStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>';
 }
});

function firstBuyDate(){
 const buys=rows.filter(r=>
   r.asset_class==="STOCK" &&
   r.type==="BUY" &&
   r.symbol===serviceNow.isin
 ).sort((a,b)=>a.date.localeCompare(b.date));
 return buys.length?buys[0].date:null;
}

async function worker(endpoint,params){
 const base=workerUrl();
 if(!base)throw new Error("Bitte zuerst die Worker-Adresse eintragen.");

 const u=new URL(base+endpoint);
 Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));

 requests++;
 log("Request "+requests+": "+u.pathname+" "+u.search);

 const res=await fetch(u.toString(),{cache:"no-store"});
 const d=await res.json();

 if(!res.ok||d.error){
   const msg=d.error||("HTTP "+res.status);
   log("FEHLER: "+msg);
   throw new Error(msg);
 }
 return d;
}

$("runTest").onclick=async()=>{
 $("runTest").disabled=true;
 $("runStatus").textContent="Test läuft …";
 $("resultsCard").classList.add("hidden");
 $("log").textContent="";
 requests=0;

 try{
   const date=firstBuyDate();
   if(!date)throw new Error("Kein ServiceNow-Kaufdatum gefunden.");

   const nowNow=await worker("/quote",{ticker:"NOW"});
   const spyNow=await worker("/quote",{ticker:"SPY"});
   const nowHist=await worker("/history",{ticker:"NOW",date});
   const spyHist=await worker("/history",{ticker:"SPY",date});

   const nowPerf=(nowNow.price/nowHist.price-1)*100;
   const spyPerf=(spyNow.price/spyHist.price-1)*100;

   $("results").innerHTML=`
    <div class="result">
      <div class="name">ServiceNow (NOW)</div>
      <div class="meta">${esc(serviceNow.isin)}</div>
      <div class="grid">
       <div class="box"><div class="k">Historischer Kurs</div><div class="v">${nowHist.price.toFixed(2)} ${esc(nowHist.currency||"")}</div><div class="meta">${esc(nowHist.date)}</div></div>
       <div class="box"><div class="k">Aktueller Kurs</div><div class="v">${nowNow.price.toFixed(2)} ${esc(nowNow.currency||"")}</div></div>
       <div class="box"><div class="k">Performance</div><div class="v">${pct(nowPerf)}</div></div>
      </div>
    </div>
    <div class="result">
      <div class="name">${BENCH.name}</div>
      <div class="meta">SPY</div>
      <div class="grid">
       <div class="box"><div class="k">Historischer Kurs</div><div class="v">${spyHist.price.toFixed(2)} ${esc(spyHist.currency||"")}</div><div class="meta">${esc(spyHist.date)}</div></div>
       <div class="box"><div class="k">Aktueller Kurs</div><div class="v">${spyNow.price.toFixed(2)} ${esc(spyNow.currency||"")}</div></div>
       <div class="box"><div class="k">Performance</div><div class="v">${pct(spyPerf)}</div></div>
      </div>
    </div>
    <div class="result">
      <div class="name">Differenz</div>
      <div class="grid">
       <div class="box"><div class="k">NOW minus SPY</div><div class="v">${pct(nowPerf-spyPerf)}-Pkt.</div></div>
       <div class="box"><div class="k">Worker-Requests</div><div class="v">${requests}</div></div>
      </div>
    </div>`;

   $("resultsCard").classList.remove("hidden");
   $("runStatus").innerHTML='<span class="good">Test erfolgreich.</span>';
 }catch(err){
   $("runStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>';
 }finally{
   $("runTest").disabled=false;
 }
};
</script>
<script>
if("serviceWorker"in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
