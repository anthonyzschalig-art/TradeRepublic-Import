<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NOW vs SPY">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<title>ServiceNow Performance vs. SPY</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--txt:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--good:#15803d;--bad:#b91c1c;--soft:#f8fafc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 45px}
h1{font-size:25px;margin:4px 0}.sub,.note,.status,.meta{font-size:13px;color:var(--muted);line-height:1.45}
.sub{margin-bottom:16px}.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input,button{font:inherit;width:100%;border-radius:11px}
input{padding:11px 12px;border:1px solid var(--line);font-size:16px;background:#fff}
button{border:0;padding:12px 14px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:#e2e8f0;color:var(--txt)}
.filelabel{display:block;background:var(--accent);color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:700;cursor:pointer}
#csvFile{display:none}.hidden{display:none!important}.good{color:var(--good)}.bad{color:var(--bad)}
.result{border-top:1px solid var(--line);padding:14px 0}.result:first-child{border-top:0}
.name{font-size:18px;font-weight:750}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.box{background:var(--soft);border-radius:11px;padding:11px}.k{font-size:11px;color:var(--muted)}.v{font-size:17px;font-weight:750;margin-top:3px}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:11px;padding:12px;max-height:300px;overflow:auto}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>ServiceNow vs. S&P 500</h1>
<div class="sub">ServiceNow wird aus deinen echten Trade-Republic-Käufen berechnet. Benchmark: SPY.</div>

<div class="card">
<h2>1 · API-Key</h2>
<label>Twelve Data API-Key</label>
<input id="apiKey" type="password" autocomplete="off" placeholder="API-Key einfügen">
<button class="secondary" id="saveKey" style="margin-top:10px">Für diese Sitzung speichern</button>
<div id="keyStatus" class="status"></div>
</div>

<div class="card">
<h2>2 · Trade-Republic-CSV</h2>
<label class="filelabel" for="csvFile">Transaktionsexport.csv auswählen</label>
<input id="csvFile" type="file" accept=".csv,text/csv">
<div id="fileStatus" class="status"></div>
</div>

<div class="card hidden" id="testCard">
<h2>3 · Zeitraum</h2>
<div id="selectionText" class="note"></div>
<div style="margin-top:12px">
<label>Startdatum für S&P-500-Vergleich</label>
<input id="startDate" type="date">
</div>
<button class="primary" id="runTest" style="margin-top:12px">Performance berechnen</button>
<div id="runStatus" class="status"></div>
</div>

<div class="card hidden" id="resultsCard">
<h2>Ergebnis</h2>
<div id="results"></div>
</div>

<div class="card hidden" id="buysCard">
<h2>ServiceNow-Käufe aus CSV</h2>
<div id="buys"></div>
</div>

<div class="card">
<h2>API-Protokoll</h2>
<div id="log" class="log">Noch keine API-Anfrage.</div>
</div>
</div>

<script>
const STOCK={symbol:"NOW",exchange:"NYSE",name:"ServiceNow"};
const BENCH={symbol:"SPY",exchange:"NYSE",name:"SPDR S&P 500 ETF Trust"};

let rows=[],serviceNowIsin=null,serviceNowRows=[],apiCalls=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const n=v=>{if(v===null||v===undefined||v==="")return 0;let x=parseFloat(String(v).replace(",","."));return Number.isFinite(x)?x:0};
const money=x=>Number(x||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const pct=x=>Number(x||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" %";
const sharesFmt=x=>Number(x||0).toLocaleString("de-DE",{minimumFractionDigits:0,maximumFractionDigits:6});

function log(msg){
 const e=$("log");
 if(e.textContent==="Noch keine API-Anfrage.")e.textContent="";
 e.textContent+="["+new Date().toLocaleTimeString("de-DE")+"] "+msg+"\n";
 e.scrollTop=e.scrollHeight;
}

function parseCSV(text){
 let out=[],row=[],cur="",quote=false;
 for(let i=0;i<text.length;i++){
   const c=text[i],next=text[i+1];
   if(c==='"'){if(quote&&next==='"'){cur+='"';i++}else quote=!quote}
   else if(c===','&&!quote){row.push(cur);cur=""}
   else if((c==='\n'||c==='\r')&&!quote){
     if(c==='\r'&&next==='\n')i++;
     row.push(cur);cur="";
     if(row.some(x=>x!==""))out.push(row);
     row=[];
   }else cur+=c;
 }
 if(cur||row.length){row.push(cur);out.push(row)}
 if(out.length<2)return [];
 const head=out[0].map(x=>x.trim());
 return out.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??""])));
}

function apiKey(){
 return $("apiKey").value.trim()||sessionStorage.getItem("tr_api_test_key")||"";
}

$("saveKey").onclick=()=>{
 const k=$("apiKey").value.trim();
 if(!k){$("keyStatus").innerHTML='<span class="bad">Bitte API-Key eingeben.</span>';return}
 sessionStorage.setItem("tr_api_test_key",k);
 $("keyStatus").innerHTML='<span class="good">Gespeichert.</span>';
};

window.addEventListener("load",()=>{
 const k=sessionStorage.getItem("tr_api_test_key");
 if(k)$("apiKey").value=k;
});

function signedShares(r){
 if(r.type==="BUY") return Math.abs(n(r.shares));
 if(r.type==="SELL") return -Math.abs(n(r.shares));
 return 0;
}

function buyCash(r){
 // Trade Republic exportiert Käufe und Gebühren negativ.
 return Math.max(0,-(n(r.amount)+n(r.fee)+n(r.tax)));
}

function sellCash(r){
 return Math.max(0,n(r.amount)+n(r.fee)+n(r.tax));
}

function earliestCSVDate(){
 const dates=rows.map(r=>r.date).filter(Boolean).sort();
 return dates.length?dates[0]:"";
}

function firstServiceNowBuy(){
 const dates=serviceNowRows.filter(r=>r.type==="BUY").map(r=>r.date).filter(Boolean).sort();
 return dates.length?dates[0]:"";
}

function actualServiceNowState(){
 let shares=0,buyTotal=0,sellTotal=0;
 for(const r of serviceNowRows){
   if(r.type==="BUY"){
     shares+=Math.abs(n(r.shares));
     buyTotal+=buyCash(r);
   }else if(r.type==="SELL"){
     shares-=Math.abs(n(r.shares));
     sellTotal+=sellCash(r);
   }
 }
 return {shares,buyTotal,sellTotal};
}

function renderBuys(){
 const tx=serviceNowRows.filter(r=>r.type==="BUY"||r.type==="SELL");
 $("buys").innerHTML=tx.map(r=>{
   const cash=r.type==="BUY"?buyCash(r):sellCash(r);
   return `<div class="result">
     <div class="name">${esc(r.type==="BUY"?"Kauf":"Verkauf")} · ${esc(r.date)}</div>
     <div class="grid">
       <div class="box"><div class="k">Stück</div><div class="v">${sharesFmt(Math.abs(n(r.shares)))}</div></div>
       <div class="box"><div class="k">TR-Kurs</div><div class="v">${money(n(r.price))}</div></div>
       <div class="box"><div class="k">${r.type==="BUY"?"Einsatz inkl. Gebühren":"Erlös netto"}</div><div class="v">${money(cash)}</div></div>
     </div>
   </div>`;
 }).join("");
 $("buysCard").classList.remove("hidden");
}

$("csvFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
   rows=parseCSV(await f.text());
   if(!rows.length)throw new Error("CSV konnte nicht gelesen werden.");

   const sn=rows.filter(r=>r.asset_class==="STOCK"&&/service\s*now/i.test(r.name||""));
   if(!sn.length)throw new Error("ServiceNow wurde im Export nicht gefunden.");

   serviceNowIsin=sn[0].symbol;
   serviceNowRows=rows.filter(r=>r.asset_class==="STOCK"&&r.symbol===serviceNowIsin);

   const start=earliestCSVDate();
   $("startDate").value=start;

   const st=actualServiceNowState();

   $("selectionText").innerHTML=
     "<b>ServiceNow-ISIN:</b> "+esc(serviceNowIsin)+"<br>"+
     "<b>Erster ServiceNow-Kauf:</b> "+esc(firstServiceNowBuy())+"<br>"+
     "<b>Frühestes Datum der CSV:</b> "+esc(start)+"<br>"+
     "<b>Aktueller Bestand laut CSV:</b> "+sharesFmt(st.shares)+" Stück<br>"+
     "<b>Gesamte Käufe inkl. Gebühren:</b> "+money(st.buyTotal);

   renderBuys();
   $("testCard").classList.remove("hidden");
   $("fileStatus").innerHTML='<span class="good">CSV geladen. ServiceNow-Transaktionen gefunden.</span>';
 }catch(err){
   $("fileStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>';
 }
});

async function td(endpoint,params={}){
 const key=apiKey();
 if(!key)throw new Error("Kein API-Key eingetragen.");

 const u=new URL("https://api.twelvedata.com/"+endpoint);
 Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});
 u.searchParams.set("apikey",key);

 apiCalls++;
 log("Call "+apiCalls+": "+endpoint+" "+JSON.stringify(params));

 const res=await fetch(u,{cache:"no-store"});
 const d=await res.json();

 if(!res.ok||d.status==="error"||d.code){
   const m=d.message||("HTTP "+res.status);
   log("FEHLER: "+m);
   throw new Error(m);
 }
 return d;
}

async function quote(asset){
 const q=await td("quote",{symbol:asset.symbol,exchange:asset.exchange});
 const p=n(q.close||q.price);
 if(!p)throw new Error("Kein aktueller Kurs für "+asset.symbol);
 return {price:p,currency:q.currency||""};
}

async function usdToEur(){
 const d=await td("price",{symbol:"USD/EUR"});
 const rate=n(d.price);
 if(!rate)throw new Error("USD/EUR konnte nicht geladen werden.");
 return rate;
}

async function historicalAtOrAfter(asset,startDate){
 const d=await td("time_series",{
   symbol:asset.symbol,
   exchange:asset.exchange,
   interval:"1day",
   start_date:startDate,
   outputsize:30,
   order:"ASC"
 });
 const vals=Array.isArray(d.values)?d.values:[];
 if(!vals.length)throw new Error("Keine historischen Kurse für "+asset.symbol);
 const valid=vals
   .map(x=>({date:x.datetime.slice(0,10),price:n(x.close)}))
   .filter(x=>x.date>=startDate&&x.price>0)
   .sort((a,b)=>a.date.localeCompare(b.date));
 if(!valid.length)throw new Error("Kein Kurs ab "+startDate+" für "+asset.symbol);
 return valid[0];
}

$("runTest").onclick=async()=>{
 $("runTest").disabled=true;
 $("runStatus").textContent="Berechnung läuft …";
 $("resultsCard").classList.add("hidden");
 $("log").textContent="";
 apiCalls=0;

 try{
   const startDate=$("startDate").value;
   if(!startDate)throw new Error("Kein Startdatum gewählt.");

   const st=actualServiceNowState();

   // 1 aktueller NOW-Kurs in USD
   const nowQuote=await quote(STOCK);

   // 2 aktueller USD/EUR-Kurs
   const fx=await usdToEur();

   // 3 aktueller SPY-Kurs
   const spyNow=await quote(BENCH);

   // 4 SPY-Kurs am/ab Startdatum
   const spyStart=await historicalAtOrAfter(BENCH,startDate);

   const nowPriceEUR=nowQuote.price*fx;
   const currentValue=st.shares*nowPriceEUR;

   // Für diese Testversion: echte Gesamtrendite aus Cashflows.
   // Verkäufe werden als bereits zurückgeflossenes Kapital berücksichtigt.
   const totalValue=currentValue+st.sellTotal;
   const nowPL=totalValue-st.buyTotal;
   const nowPerf=st.buyTotal>0?nowPL/st.buyTotal*100:0;

   const spyPerf=(spyNow.price/spyStart.price-1)*100;

   $("results").innerHTML=`
    <div class="result">
      <div class="name">ServiceNow · echte TR-Performance</div>
      <div class="meta">Aktueller US-Ticker: NOW @ NYSE · Umrechnung über USD/EUR</div>
      <div class="grid">
        <div class="box"><div class="k">Käufe inkl. Gebühren</div><div class="v">${money(st.buyTotal)}</div></div>
        <div class="box"><div class="k">Aktueller Bestand</div><div class="v">${sharesFmt(st.shares)} Stück</div></div>
        <div class="box"><div class="k">NOW aktuell</div><div class="v">${nowQuote.price.toFixed(2)} USD</div></div>
        <div class="box"><div class="k">NOW aktuell in EUR</div><div class="v">${money(nowPriceEUR)}</div></div>
        <div class="box"><div class="k">Aktueller Positionswert</div><div class="v">${money(currentValue)}</div></div>
        <div class="box"><div class="k">Gewinn / Verlust</div><div class="v ${nowPL>=0?"good":"bad"}">${money(nowPL)}</div></div>
        <div class="box"><div class="k">Performance</div><div class="v ${nowPerf>=0?"good":"bad"}">${pct(nowPerf)}</div></div>
      </div>
    </div>

    <div class="result">
      <div class="name">S&P 500 · SPY</div>
      <div class="meta">Zeitraum: ${esc(spyStart.date)} bis heute</div>
      <div class="grid">
        <div class="box"><div class="k">Startkurs</div><div class="v">${spyStart.price.toFixed(2)} USD</div></div>
        <div class="box"><div class="k">Aktueller Kurs</div><div class="v">${spyNow.price.toFixed(2)} USD</div></div>
        <div class="box"><div class="k">Performance</div><div class="v ${spyPerf>=0?"good":"bad"}">${pct(spyPerf)}</div></div>
      </div>
    </div>

    <div class="result">
      <div class="name">Vergleich</div>
      <div class="grid">
        <div class="box"><div class="k">ServiceNow</div><div class="v">${pct(nowPerf)}</div></div>
        <div class="box"><div class="k">SPY seit ${esc(spyStart.date)}</div><div class="v">${pct(spyPerf)}</div></div>
      </div>
    </div>`;

   $("resultsCard").classList.remove("hidden");
   $("runStatus").innerHTML='<span class="good">Berechnung erfolgreich.</span>';
 }catch(err){
   $("runStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>';
 }finally{
   $("runTest").disabled=false;
 }
};
</script>

<script>
if("serviceWorker"in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
