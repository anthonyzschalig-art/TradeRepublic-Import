<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TR API Test">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<title>TR API Test</title>
<style>
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 45px}
.card{background:#fff;border-radius:17px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
h1{font-size:25px;margin:4px 0}.sub,.note,.status,.meta{font-size:13px;color:#64748b;line-height:1.45}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:12px;color:#64748b;margin-bottom:5px}
input,button{font:inherit;width:100%;border-radius:11px}
input{padding:11px 12px;border:1px solid #e2e8f0;font-size:16px}
button{border:0;padding:12px 14px;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0}
.filelabel{display:block;background:#2563eb;color:#fff;text-align:center;padding:13px;border-radius:11px;font-weight:700}
#csvFile{display:none}.hidden{display:none}.good{color:#15803d}.bad{color:#b91c1c}
.result{border-top:1px solid #e2e8f0;padding:14px 0}.result:first-child{border-top:0}
.name{font-size:18px;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.box{background:#f8fafc;border-radius:11px;padding:11px}.k{font-size:11px;color:#64748b}.v{font-size:17px;font-weight:750;margin-top:3px}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:11px;padding:12px;max-height:260px;overflow:auto}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>Trade Republic · API-Test</h1>
<div class="sub">Nur ServiceNow und ein ETF werden abgefragt.</div>

<div class="card">
<h2>1 · API-Key</h2>
<label>Twelve Data API-Key</label>
<input id="apiKey" type="password" autocomplete="off">
<button class="secondary" id="saveKey" style="margin-top:10px">Für diese Sitzung speichern</button>
<div id="keyStatus" class="status"></div>
</div>

<div class="card">
<h2>2 · Trade-Republic-CSV</h2>
<label class="filelabel" for="csvFile">Transaktionsexport.csv auswählen</label>
<input id="csvFile" type="file" accept=".csv,text/csv">
<div id="fileStatus" class="status"></div>
</div>

<div class="card hidden" id="selectionCard">
<h2>3 · Test</h2>
<div id="selectionText" class="note"></div>
<button class="primary" id="runTest" style="margin-top:12px">ServiceNow + ETF testen</button>
<div id="runStatus" class="status"></div>
</div>

<div class="card hidden" id="resultsCard"><h2>Ergebnis</h2><div id="results"></div></div>

<div class="card"><h2>API-Protokoll</h2><div id="log" class="log">Noch keine API-Anfrage.</div></div>
</div>

<script>
let rows=[],serviceNow=null,selectedETF=null,apiCalls=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const n=v=>{let x=parseFloat(String(v??"").replace(",","."));return Number.isFinite(x)?x:0};
const money=x=>Number(x||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(msg){const e=$("log");if(e.textContent==="Noch keine API-Anfrage.")e.textContent="";e.textContent+="["+new Date().toLocaleTimeString("de-DE")+"] "+msg+"\n";e.scrollTop=e.scrollHeight}
function parseCSV(text){
 let out=[],row=[],cur="",quote=false;
 for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];
  if(c==='"'){if(quote&&next==='"'){cur+='"';i++}else quote=!quote}
  else if(c===','&&!quote){row.push(cur);cur=""}
  else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&next==='\n')i++;row.push(cur);cur="";if(row.some(x=>x!==""))out.push(row);row=[]}
  else cur+=c}
 if(cur||row.length){row.push(cur);out.push(row)}
 if(out.length<2)return [];
 const head=out[0].map(x=>x.trim());
 return out.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??""])));
}
function apiKey(){return $("apiKey").value.trim()||sessionStorage.getItem("tr_api_test_key")||""}
$("saveKey").onclick=()=>{const k=$("apiKey").value.trim();if(!k){$("keyStatus").innerHTML='<span class="bad">Bitte API-Key eingeben.</span>';return}sessionStorage.setItem("tr_api_test_key",k);$("keyStatus").innerHTML='<span class="good">Gespeichert.</span>'}
window.addEventListener("load",()=>{const k=sessionStorage.getItem("tr_api_test_key");if(k)$("apiKey").value=k})
$("csvFile").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  rows=parseCSV(await f.text());
  const pos={};
  for(const r of rows){if(!["STOCK","FUND"].includes(r.asset_class)||!r.symbol)continue;
   if(!pos[r.symbol])pos[r.symbol]={isin:r.symbol,name:r.name||r.symbol,asset_class:r.asset_class,shares:0};
   if(r.type==="BUY"||r.type==="SELL")pos[r.symbol].shares+=n(r.shares)}
  const open=Object.values(pos).filter(x=>Math.abs(x.shares)>1e-8);
  serviceNow=open.find(x=>x.asset_class==="STOCK"&&/service\s*now/i.test(x.name));
  selectedETF=open.find(x=>x.asset_class==="FUND");
  if(!serviceNow)throw new Error("ServiceNow nicht gefunden.");
  if(!selectedETF)throw new Error("Kein offener ETF gefunden.");
  $("selectionText").innerHTML="<b>Aktie:</b> "+esc(serviceNow.name)+"<br><b>ETF:</b> "+esc(selectedETF.name);
  $("selectionCard").classList.remove("hidden");
  $("fileStatus").innerHTML='<span class="good">CSV geladen.</span>';
 }catch(err){$("fileStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>'}
});
async function td(endpoint,params={}){
 const key=apiKey();if(!key)throw new Error("Kein API-Key eingetragen.");
 const u=new URL("https://api.twelvedata.com/"+endpoint);
 Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!==null&&v!=="")u.searchParams.set(k,v)});
 u.searchParams.set("apikey",key);
 apiCalls++;log("Call "+apiCalls+": "+endpoint+" "+JSON.stringify(params));
 const res=await fetch(u,{cache:"no-store"});
 const left=res.headers.get("api-credits-left"),used=res.headers.get("api-credits-used");
 if(left||used)log("Credits used="+(used??"?")+", left="+(left??"?"));
 const d=await res.json();
 if(!res.ok||d.status==="error"||d.code){const m=d.message||("HTTP "+res.status);log("FEHLER: "+m);throw new Error(m)}
 return d;
}
function score(inst,c){let s=0;if(inst.asset_class==="FUND"&&c.instrument_type==="ETF")s+=40;if(inst.asset_class==="STOCK"&&c.instrument_type==="Common Stock")s+=40;if(c.currency==="EUR")s+=25;if(/xetr/i.test(c.exchange||""))s+=15;const a=inst.name.toLowerCase(),b=String(c.instrument_name||"").toLowerCase();if(b&&(a.includes(b)||b.includes(a)))s+=30;return s}
async function resolve(inst){
 const d=await td("symbol_search",{symbol:inst.name,outputsize:20});
 const arr=Array.isArray(d.data)?d.data:[];
 if(!arr.length)throw new Error("Keine Treffer für "+inst.name);
 arr.sort((a,b)=>score(inst,b)-score(inst,a));
 const best=arr[0];log("Zuordnung "+inst.name+" -> "+best.symbol+" @ "+(best.exchange||"-"));return best;
}
async function quoteEUR(c){
 const q=await td("quote",{symbol:c.symbol,exchange:c.exchange||undefined});
 let price=n(q.close||q.price),currency=q.currency||c.currency||"";
 if(!price)throw new Error("Kein Kurs für "+c.symbol);
 if(currency&&currency!=="EUR"){await sleep(700);const fx=await td("price",{symbol:currency+"/EUR"});price*=n(fx.price)}
 return price;
}
$("runTest").onclick=async()=>{
 $("runTest").disabled=true;$("runStatus").textContent="Test läuft …";$("resultsCard").classList.add("hidden");$("log").textContent="";apiCalls=0;
 try{
  const sn=await resolve(serviceNow);await sleep(800);
  const etf=await resolve(selectedETF);await sleep(800);
  const snp=await quoteEUR(sn);await sleep(800);
  const etfp=await quoteEUR(etf);
  $("results").innerHTML=
   '<div class="result"><div class="name">'+esc(serviceNow.name)+'</div><div class="grid"><div class="box"><div class="k">Ticker</div><div class="v">'+esc(sn.symbol)+'</div></div><div class="box"><div class="k">Börse</div><div class="v">'+esc(sn.exchange||"–")+'</div></div><div class="box"><div class="k">Kurs</div><div class="v">'+money(snp)+'</div></div></div></div>'+
   '<div class="result"><div class="name">'+esc(selectedETF.name)+'</div><div class="grid"><div class="box"><div class="k">Ticker</div><div class="v">'+esc(etf.symbol)+'</div></div><div class="box"><div class="k">Börse</div><div class="v">'+esc(etf.exchange||"–")+'</div></div><div class="box"><div class="k">Kurs</div><div class="v">'+money(etfp)+'</div></div></div></div>';
  $("resultsCard").classList.remove("hidden");$("runStatus").innerHTML='<span class="good">Test erfolgreich. '+apiCalls+' API-Aufrufe.</span>';
 }catch(err){$("runStatus").innerHTML='<span class="bad">'+esc(err.message)+'</span>'}
 finally{$("runTest").disabled=false}
}
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"))}</script>
</body>
</html>
